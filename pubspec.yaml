name: flutter_template
description: "DocMark — secure, local-first document watermarking."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.9
  gap: ^3.0.1
  flutter_svg: ^2.3.0

  # State management
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

  # Navigation
  go_router: ^17.4.0

  # Persistence
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.0.0
  drift: ^2.35.4
  sqlite3: ^3.9.1
  sqlcipher_flutter_libs: ^0.6.8

  # Security
  cryptography: ^2.9.0
  local_auth: ^3.0.2

  # Files, media and export
  file_picker: ^13.3.3
  image_picker: ^1.2.4
  image: ^4.12.0
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  pdf: ^3.13.1
  pdfrx: ^2.12.0
  uuid: ^4.6.0

  # Generator and annotations
  freezed_annotation: ^3.1.0
  dart_mappable: ^4.8.0

  # Logging
  logger: ^2.7.0

  # Localization
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.4
  flutter_gen_runner: ^5.15.0
  dart_mappable_builder: ^4.9.0
  drift_dev: ^2.35.3
  # WHY: freezed 3 emits `final` on a generated constructor parameter, which
  # Dart 3.13 rejects — the 4.0.0-dev line is the first that stops emitting it,
  # so the pre-release pin is what makes the app compile at all. It carries the
  # codegen chain to analyzer 13, which is why dart_mappable_builder is on 4.9.
  # Move to a plain caret when freezed 4 ships stable.
  freezed: ^4.0.0-dev.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/inter/
    - assets/fonts/roboto/
    - assets/fonts/roboto_mono/
    - assets/fonts/montserrat/
    - assets/fonts/lora/
    - assets/fonts/merriweather/
    - assets/fonts/caveat/
    - assets/fonts/LICENSES/

  # WHY: the six bundled families and their faces. T9 replaces every
  # placeholder byte with the real font file; the family names and asset
  # paths below are the frozen contract every editor screen reads through
  # `FontRegistry`.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/inter/Inter-Italic.ttf
          style: italic
        - asset: assets/fonts/inter/Inter-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto/Roboto-Regular.ttf
        - asset: assets/fonts/roboto/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/roboto/Roboto-Italic.ttf
          style: italic
        - asset: assets/fonts/roboto/Roboto-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Roboto Mono
      fonts:
        - asset: assets/fonts/roboto_mono/RobotoMono-Regular.ttf
        - asset: assets/fonts/roboto_mono/RobotoMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/roboto_mono/RobotoMono-Italic.ttf
          style: italic
        - asset: assets/fonts/roboto_mono/RobotoMono-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Montserrat
      fonts:
        - asset: assets/fonts/montserrat/Montserrat-Regular.ttf
        - asset: assets/fonts/montserrat/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/montserrat/Montserrat-Italic.ttf
          style: italic
        - asset: assets/fonts/montserrat/Montserrat-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Lora
      fonts:
        - asset: assets/fonts/lora/Lora-Regular.ttf
        - asset: assets/fonts/lora/Lora-Bold.ttf
          weight: 700
        - asset: assets/fonts/lora/Lora-Italic.ttf
          style: italic
        - asset: assets/fonts/lora/Lora-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Merriweather
      fonts:
        - asset: assets/fonts/merriweather/Merriweather-Regular.ttf
        - asset: assets/fonts/merriweather/Merriweather-Bold.ttf
          weight: 700
        - asset: assets/fonts/merriweather/Merriweather-Italic.ttf
          style: italic
    - family: Caveat
      fonts:
        - asset: assets/fonts/caveat/Caveat-Regular.ttf


flutter_gen:
  output: lib/src/presentation/core/gen
  line_length: 80

  integrations:
    flutter_svg: true
